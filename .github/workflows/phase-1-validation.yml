name: Phase 1 validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore ServeX.sln -p:TestWindows=true
      - run: dotnet build ServeX.sln --no-restore -c Release -p:TestWindows=true
      - run: dotnet test Tests/ServeX.Tests.csproj --no-build --no-restore -c Release -p:TestWindows=true --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: TestResults
