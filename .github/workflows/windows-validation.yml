name: ServeX Windows validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/validate_ui.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore ServeX.sln -p:TestWindows=true
      - run: dotnet build ServeX.sln --no-restore -c Release -p:TestWindows=true
      - run: dotnet test Tests/ServeX.Tests.csproj --no-build --no-restore -c Release -p:TestWindows=true --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: TestResults
      - run: dotnet publish ServeX.csproj -c Release -r win-x64 --self-contained true -p:TestWindows=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: ServeX-windows-exe
          path: publish
